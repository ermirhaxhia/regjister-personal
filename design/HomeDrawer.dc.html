<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #FF7A3C; } a:hover { color: #ff9159; }
    @keyframes rp-scrim { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rp-slidein { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    @keyframes rp-stagger { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .scrim { animation: rp-scrim .25s ease both; }
    .drawer { animation: rp-slidein .32s cubic-bezier(.2,.8,.2,1) both; }
    .di { animation: rp-stagger .3s ease both; }
    .icn { transition: transform .18s cubic-bezier(.2,.7,.2,1); }
    .di:hover .icn { transform: scale(1.12); }
  </style>
</helmet>

<div style="position:relative;width:390px;height:844px;background:#0A0A0C;color:#F4F4F5;font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden;box-sizing:border-box">

  <!-- Përmbajtja pas (e zbehur) -->
  <div style="position:absolute;inset:0;filter:brightness(0.5)">
    <div style="display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,0.06);box-sizing:border-box">
      <div style="width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,0.09)"></div>
      <div style="flex:1;font:600 15px/1 'Space Grotesk',sans-serif;color:#F4F4F5">Faqja kryesore</div>
      <div style="width:34px;height:34px;border-radius:10px;background:#FF7A3C"></div>
    </div>
    <div style="padding:14px;display:flex;flex-direction:column;gap:13px">
      <div style="height:120px;background:#121216;border:1px solid rgba(255,255,255,0.07);border-radius:16px"></div>
      <div style="display:flex;gap:10px">
        <div style="flex:1;height:64px;background:#121216;border:1px solid rgba(255,255,255,0.07);border-radius:14px"></div>
        <div style="flex:1;height:64px;background:#121216;border:1px solid rgba(255,255,255,0.07);border-radius:14px"></div>
        <div style="flex:1;height:64px;background:#121216;border:1px solid rgba(255,255,255,0.07);border-radius:14px"></div>
      </div>
      <div style="height:110px;background:#121216;border:1px solid rgba(255,255,255,0.07);border-radius:16px"></div>
    </div>
  </div>

  <!-- Scrim -->
  <div class="scrim" style="position:absolute;inset:0;background:rgba(0,0,0,0.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)"></div>

  <!-- Drawer (glass) -->
  <div class="drawer" style="position:absolute;left:0;top:0;bottom:0;width:270px;background:rgba(16,16,20,0.96);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);border-right:1px solid rgba(255,255,255,0.10);display:flex;flex-direction:column;padding:18px 14px;box-sizing:border-box;box-shadow:24px 0 60px rgba(0,0,0,0.5)">
    <div class="di" style="display:flex;align-items:center;gap:10px;padding:0 6px 4px">
      <div style="width:34px;height:34px;border-radius:10px;background:#141418;border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center">
        <svg width="17" height="17" viewBox="0 0 22 22" fill="none"><rect x="3" y="12" width="4" height="7" rx="1" fill="#B8B8BF"/><rect x="9" y="8" width="4" height="11" rx="1" fill="#B8B8BF"/><rect x="15" y="4" width="4" height="15" rx="1" fill="#FF7A3C"/></svg>
      </div>
      <div style="flex:1;font:600 14px/1 'Space Grotesk',sans-serif;color:#E7E7EA">Regjistri</div>
      <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid rgba(255,255,255,0.09)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A93" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
    </div>

    <div style="height:14px"></div>

    <div class="di" style="animation-delay:.04s;position:relative;display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:10px;background:rgba(255,122,60,0.18);color:#F4F4F5">
      <span style="position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#FF7A3C"></span>
      <svg class="icn" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FF7A3C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/><path d="M10 20v-4.5h4V20"/></svg>
      <span style="font:500 13px/1 'IBM Plex Sans',sans-serif">Kryesore</span>
    </div>

    <div class="di" style="animation-delay:.07s;padding:16px 12px 8px;font:600 9.5px/1 'IBM Plex Sans',sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#6F6F79">Module</div>

    <div class="di" style="animation-delay:.1s;display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:10px;color:#B4B4BE">
      <svg class="icn" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B4B4BE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h11v4"/><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M16 12h5v4h-5a2 2 0 0 1 0-4z"/></svg>
      <span style="font:400 13px/1 'IBM Plex Sans',sans-serif">Shpenzime</span>
      <span style="flex:1"></span>
      <span style="font:500 11px/1 'IBM Plex Mono',monospace;color:#7C7C87">68</span>
    </div>
    <div class="di" style="animation-delay:.13s;display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:10px;color:#B4B4BE">
      <svg class="icn" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B4B4BE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 10v4M18 10v4"/></svg>
      <span style="font:400 13px/1 'IBM Plex Sans',sans-serif">Të ardhura</span>
      <span style="flex:1"></span>
      <span style="font:500 11px/1 'IBM Plex Mono',monospace;color:#7C7C87">1</span>
    </div>
    <div class="di" style="animation-delay:.16s;display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:10px;color:#B4B4BE">
      <svg class="icn" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B4B4BE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5z"/></svg>
      <span style="font:400 13px/1 'IBM Plex Sans',sans-serif">Gjumi</span>
      <span style="flex:1"></span>
      <span style="font:500 11px/1 'IBM Plex Mono',monospace;color:#7C7C87">21</span>
    </div>

    <div style="flex:1"></div>

    <div class="di" style="animation-delay:.19s;display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:10px;color:#9AA0AA">
      <svg class="icn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0AA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2.3"/><circle cx="15" cy="16" r="2.3"/></svg>
      <span style="font:400 12.5px/1 'IBM Plex Sans',sans-serif">Cilësime</span>
    </div>
    <div class="di" style="animation-delay:.22s;display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:10px;color:#9AA0AA">
      <svg class="icn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA0AA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M4 12h11M11 8l4 4-4 4"/></svg>
      <span style="font:400 12.5px/1 'IBM Plex Sans',sans-serif">Dil</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
